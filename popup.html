<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Key & Mouse Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Key & Mouse Blocker</h1>
    <div id="pageLabel" class="muted">Loading current page…</div>

    <label class="row">
      <span>Scope</span>
      <select id="scope">
        <option value="page">This exact page</option>
        <option value="origin">Entire site</option>
      </select>
    </label>

    <label class="toggleRow">
      <span>Block controls here</span>
      <input id="enabled" type="checkbox" />
    </label>

    <section>
      <h2>Blocked keyboard keys</h2>
      <button id="captureKey" type="button">Press a key to add</button>
      <div id="captureHint" class="muted small"></div>
      <div id="keyList" class="chips"></div>
    </section>

    <section>
      <h2>Blocked mouse buttons</h2>
      <label><input type="checkbox" class="mouse" value="0" /> Left</label>
      <label><input type="checkbox" class="mouse" value="1" /> Middle / wheel click</label>
      <label><input type="checkbox" class="mouse" value="2" /> Right</label>
      <label><input type="checkbox" class="mouse" value="3" /> Back / Mouse 4</label>
      <label><input type="checkbox" class="mouse" value="4" /> Forward / Mouse 5</label>
    </section>

    <div class="actions">
      <button id="save" type="button" class="primary">Save</button>
      <button id="deleteRule" type="button">Delete rule</button>
    </div>

    <div id="status" class="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
